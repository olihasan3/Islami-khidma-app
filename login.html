<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Login - ইসলামী খিদমাহ</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
  background:#f3f8f4;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:white;
  padding:25px 20px;
  border-radius:22px;
  box-shadow:0 5px 25px #00000015;
}

.logo{
  width:75px;
  height:75px;
  background:#087443;
  color:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 15px;
  font-size:35px;
}

h1{
  text-align:center;
  color:#087443;
  font-size:23px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:13px;
  line-height:1.6;
  margin-top:7px;
}

label{
  display:block;
  font-weight:bold;
  font-size:14px;
  margin-top:20px;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d7e2db;
  border-radius:12px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#087443;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#087443;
  color:white;
  font-size:15px;
  font-weight:bold;
  margin-top:18px;
}

button:disabled{
  opacity:.6;
}

#recaptcha-container{
  margin-top:12px;
}

#otpSection{
  display:none;
}

.message{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  white-space:pre-wrap;
}

.success{
  background:#e5f7eb;
  color:#075d35;
}

.error{
  background:#ffe8e8;
  color:#a00000;
}

.loading{
  background:#fff5d9;
  color:#765500;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#087443;
  text-decoration:none;
  font-size:13px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">☪</div>

  <h1>ইসলামী খিদমাহ</h1>

  <p class="subtitle">
    Customer Account তৈরি করতে মোবাইল নম্বর ব্যবহার করুন
  </p>

  <!-- Phone -->

  <div id="phoneSection">

    <label>📱 মোবাইল নম্বর</label>

    <input
      type="tel"
      id="phone"
      placeholder="01XXXXXXXXX"
      maxlength="11"
      inputmode="numeric"
    >

    <div id="recaptcha-container"></div>

    <button
      id="sendBtn"
      type="button"
    >
      OTP পাঠান
    </button>

  </div>


  <!-- OTP -->

  <div id="otpSection">

    <label>🔐 OTP কোড</label>

    <input
      type="text"
      id="otp"
      placeholder="৬ সংখ্যার OTP"
      maxlength="6"
      inputmode="numeric"
    >

    <button
      id="verifyBtn"
      type="button"
    >
      Verify করে Login করুন
    </button>

  </div>


  <div
    id="message"
    class="message"
  ></div>


  <a href="index.html" class="back">
    ← Home Page
  </a>

</div>


<script type="module">

import { auth } from "./firebase-config.js";

import {
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


let confirmationResult = null;
let recaptchaVerifier = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.innerText = text;

  box.className =
    "message " + type;

  box.style.display = "block";
}


/* =========================
   RECAPTCHA
========================= */

function setupRecaptcha(){

  if(recaptchaVerifier){
    return;
  }

  recaptchaVerifier =
    new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {
        size:"normal",

        callback:function(){

          showMessage(
            "✅ Verification সম্পন্ন হয়েছে। এখন OTP পাঠাতে চাপুন।",
            "success"
          );

        },

        "expired-callback":function(){

          showMessage(
            "reCAPTCHA-এর সময় শেষ হয়েছে। আবার চেষ্টা করুন।",
            "error"
          );

        }

      }
    );

}


/* =========================
   SEND OTP
========================= */

document
.getElementById("sendBtn")
.addEventListener("click", async function(){

  const phoneInput =
    document.getElementById("phone");

  const sendBtn =
    document.getElementById("sendBtn");

  let phone =
    phoneInput.value.trim();


  /* Bangladesh number check */

  if(!/^01[3-9]\d{8}$/.test(phone)){

    showMessage(
      "সঠিক বাংলাদেশি মোবাইল নম্বর দিন।\nউদাহরণ: 01712345678",
      "error"
    );

    return;
  }


  let fullPhone =
    "+88" + phone;


  sendBtn.disabled = true;

  showMessage(
    "⏳ Firebase-এর মাধ্যমে OTP পাঠানো হচ্ছে...",
    "loading"
  );


  try{

    setupRecaptcha();


    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        fullPhone,
        recaptchaVerifier
      );


    document
      .getElementById("otpSection")
      .style.display = "block";


    showMessage(
      "✅ OTP পাঠানো হয়েছে।\nআপনার SMS থেকে ৬ সংখ্যার OTP দিন।",
      "success"
    );


  }catch(error){

    console.error(
      "Firebase Phone Auth Error:",
      error
    );


    sendBtn.disabled = false;


    let errorText =
      "❌ OTP পাঠানো যায়নি।\n\n";


    if(error.code){

      errorText +=
        "Error Code: " +
        error.code +
        "\n\n";
    }


    if(error.message){

      errorText +=
        error.message;
    }


    showMessage(
      errorText,
      "error"
    );


    /* Reset reCAPTCHA */

    try{

      if(recaptchaVerifier){

        recaptchaVerifier.clear();

        recaptchaVerifier = null;

      }

      document
        .getElementById(
          "recaptcha-container"
        )
        .innerHTML = "";

      setupRecaptcha();

    }catch(e){

      console.log(e);

    }

  }

});


/* =========================
   VERIFY OTP
========================= */

document
.getElementById("verifyBtn")
.addEventListener("click", async function(){

  const otp =
    document
      .getElementById("otp")
      .value
      .trim();


  if(!/^\d{6}$/.test(otp)){

    showMessage(
      "৬ সংখ্যার OTP দিন।",
      "error"
    );

    return;
  }


  if(!confirmationResult){

    showMessage(
      "আগে OTP পাঠান।",
      "error"
    );

    return;
  }


  const verifyBtn =
    document.getElementById("verifyBtn");

  verifyBtn.disabled = true;


  showMessage(
    "⏳ OTP যাচাই করা হচ্ছে...",
    "loading"
  );


  try{

    const result =
      await confirmationResult.confirm(otp);


    const user =
      result.user;


    /* Save basic login information */

    localStorage.setItem(
      "customer_uid",
      user.uid
    );


    localStorage.setItem(
      "customer_phone",
      user.phoneNumber || ""
    );


    showMessage(
      "✅ Login সফল হয়েছে!\nCustomer Home Page খোলা হচ্ছে...",
      "success"
    );


    setTimeout(function(){

      window.location.href =
        "index.html";

    },1200);


  }catch(error){

    console.error(
      "OTP Verification Error:",
      error
    );


    verifyBtn.disabled = false;


    showMessage(
      "❌ OTP যাচাই করা যায়নি।\n\n" +
      "Error Code: " +
      (error.code || "unknown") +
      "\n\n" +
      (error.message || ""),
      "error"
    );

  }

});


/* Start reCAPTCHA */

setupRecaptcha();

</script>

</body>
  </html>

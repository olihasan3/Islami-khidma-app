```html
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>লগইন | ইসলামী খিদমাহ</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
  background:#f3f8f4;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  color:#173b2a;
}

.box{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:22px;
  padding:25px 20px;
  box-shadow:0 5px 25px #00000012;
}

.logo{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#087443;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 15px;
  font-size:36px;
}

h1{
  text-align:center;
  font-size:23px;
  color:#087443;
}

.subtitle{
  text-align:center;
  margin-top:7px;
  color:#777;
  font-size:13px;
  line-height:1.6;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-size:14px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #dce5df;
  border-radius:12px;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#087443;
}

button{
  width:100%;
  border:none;
  padding:14px;
  border-radius:12px;
  background:#087443;
  color:white;
  font-size:15px;
  font-weight:bold;
  margin-top:18px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.otp{
  display:none;
}

.message{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  background:#eef8f2;
  color:#087443;
  font-size:13px;
  line-height:1.6;
  display:none;
}

.recaptcha{
  margin-top:10px;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#087443;
  text-decoration:none;
  font-size:13px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">
    ☪
  </div>

  <h1>ইসলামী খিদমাহ</h1>

  <p class="subtitle">
    আপনার মোবাইল নম্বর দিয়ে Customer Account তৈরি করুন
    অথবা Login করুন।
  </p>


  <!-- PHONE -->

  <div id="phoneSection">

    <label>
      📱 মোবাইল নম্বর
    </label>

    <input
      type="tel"
      id="phone"
      placeholder="01XXXXXXXXX"
      maxlength="11"
    >

    <div id="recaptcha-container"
         class="recaptcha">
    </div>

    <button
      id="sendBtn"
      onclick="sendOTP()"
    >
      OTP পাঠান
    </button>

  </div>


  <!-- OTP -->

  <div
    id="otpSection"
    class="otp"
  >

    <label>
      🔐 OTP কোড
    </label>

    <input
      type="number"
      id="otp"
      placeholder="৬ সংখ্যার OTP"
      maxlength="6"
    >

    <button
      onclick="verifyOTP()"
    >
      Verify করে Login করুন
    </button>

  </div>


  <div
    id="message"
    class="message"
  ></div>


  <a
    href="index.html"
    class="back"
  >
    ← Home Page
  </a>

</div>


<script type="module">

import { auth } from "./firebase-config.js";

import {
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


let confirmationResult;


/* Message */

function showMessage(text){

  const message =
    document.getElementById("message");

  message.innerText = text;

  message.style.display = "block";
}


/* reCAPTCHA */

window.recaptchaVerifier =
  new RecaptchaVerifier(
    auth,
    "recaptcha-container",
    {
      size:"normal"
    }
  );


/* Send OTP */

window.sendOTP = async function(){

  let phone =
    document.getElementById("phone").value.trim();


  if(phone.length !== 11 ||
     !phone.startsWith("01")){

    showMessage(
      "দয়া করে সঠিক ১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর দিন।"
    );

    return;
  }


  let internationalPhone =
    "+88" + phone;


  const sendBtn =
    document.getElementById("sendBtn");

  sendBtn.disabled = true;

  showMessage(
    "OTP পাঠানো হচ্ছে..."
  );


  try{

    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        internationalPhone,
        window.recaptchaVerifier
      );


    document.getElementById("otpSection")
      .style.display = "block";


    showMessage(
      "✅ OTP পাঠানো হয়েছে। আপনার মোবাইলে পাওয়া ৬ সংখ্যার OTP দিন।"
    );


  }catch(error){

    console.error(error);

    sendBtn.disabled = false;

    showMessage(
      "❌ OTP পাঠানো যায়নি। নম্বর ও Firebase Phone Authentication সেটিংস পরীক্ষা করুন।"
    );

  }

};


/* Verify OTP */

window.verifyOTP = async function(){

  const otp =
    document.getElementById("otp").value.trim();


  if(otp.length !== 6){

    showMessage(
      "দয়া করে ৬ সংখ্যার OTP দিন।"
    );

    return;
  }


  try{

    const result =
      await confirmationResult.confirm(otp);


    const user = result.user;


    localStorage.setItem(
      "customer_uid",
      user.uid
    );


    localStorage.setItem(
      "customer_phone",
      user.phoneNumber
    );


    showMessage(
      "✅ Login সফল হয়েছে। Customer Home খুলছে..."
    );


    setTimeout(function(){

      window.location.href =
        "index.html";

    },1200);


  }catch(error){

    console.error(error);

    showMessage(
      "❌ OTP সঠিক নয় অথবা OTP-এর মেয়াদ শেষ হয়েছে।"
    );

  }

};

</script>

</body>
</html>
```

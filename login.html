<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Login - ইসলামী খিদমাহ</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
  background:#f3f8f4;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:white;
  padding:25px 20px;
  border-radius:22px;
  box-shadow:0 5px 25px #00000015;
}

.logo{
  width:75px;
  height:75px;
  background:#087443;
  color:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 15px;
  font-size:35px;
}

h1{
  text-align:center;
  color:#087443;
  font-size:23px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:13px;
  line-height:1.6;
  margin-top:7px;
}

label{
  display:block;
  font-weight:bold;
  font-size:14px;
  margin-top:20px;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d7e2db;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#087443;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#087443;
  color:white;
  font-size:15px;
  font-weight:bold;
  margin-top:18px;
}

button:disabled{
  opacity:.6;
}

#recaptcha-container{
  margin-top:15px;
  min-height:80px;
}

#otpSection{
  display:none;
}

.message{
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  white-space:pre-wrap;
}

.success{
  background:#e5f7eb;
  color:#075d35;
}

.error{
  background:#ffe8e8;
  color:#a00000;
}

.loading{
  background:#fff5d9;
  color:#765500;
}

.back{
  display:block;
  text-align:center;
  margin-top:18px;
  color:#087443;
  text-decoration:none;
  font-size:13px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">☪</div>

  <h1>ইসলামী খিদমাহ</h1>

  <p class="subtitle">
    Customer Account তৈরি করতে মোবাইল নম্বর ব্যবহার করুন
  </p>

  <div id="phoneSection">

    <label>📱 মোবাইল নম্বর</label>

    <input
      type="tel"
      id="phone"
      placeholder="01XXXXXXXXX"
      maxlength="11"
      inputmode="numeric"
    >

    <div id="recaptcha-container"></div>

    <button id="sendBtn" type="button">
      OTP পাঠান
    </button>

  </div>

  <div id="otpSection">

    <label>🔐 OTP কোড</label>

    <input
      type="text"
      id="otp"
      placeholder="৬ সংখ্যার OTP"
      maxlength="6"
      inputmode="numeric"
    >

    <button id="verifyBtn" type="button">
      Verify করে Login করুন
    </button>

  </div>

  <div id="message"></div>

  <a href="index.html" class="back">
    ← Home Page
  </a>

</div>


<script type="module">

import { auth } from "./firebase-config.js";

import {
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


let confirmationResult = null;
let recaptchaVerifier = null;


/* MESSAGE */

function showMessage(text,type){

  const box = document.getElementById("message");

  box.innerText = text;

  box.className = "message " + type;

}


/* START RECAPTCHA */

async function startRecaptcha(){

  try{

    showMessage(
      "⏳ নিরাপত্তা যাচাই চালু হচ্ছে...",
      "loading"
    );

    if(recaptchaVerifier){

      return;

    }

    recaptchaVerifier = new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {

        size:"normal",

        callback:function(){

          showMessage(
            "✅ নিরাপত্তা যাচাই সম্পন্ন হয়েছে। এখন OTP পাঠান চাপুন।",
            "success"
          );

        },

        "expired-callback":function(){

          showMessage(
            "⚠️ নিরাপত্তা যাচাইয়ের সময় শেষ হয়েছে। আবার চেষ্টা করুন।",
            "error"
          );

        }

      }
    );

    await recaptchaVerifier.render();

    showMessage(
      "✅ নিরাপত্তা যাচাই প্রস্তুত।",
      "success"
    );

  }catch(error){

    console.error(error);

    showMessage(
      "❌ reCAPTCHA চালু হয়নি।\n\n" +
      "Error Code: " +
      (error.code || "unknown") +
      "\n\n" +
      (error.message || error),
      "error"
    );

  }

}


/* PAGE LOAD */

startRecaptcha();


/* SEND OTP */

document.getElementById("sendBtn").addEventListener(
  "click",
  async function(){

    const sendBtn =
      document.getElementById("sendBtn");

    const phoneInput =
      document.getElementById("phone");

    let phone =
      phoneInput.value.trim();


    /* NUMBER CHECK */

    if(!/^01[3-9]\d{8}$/.test(phone)){

      showMessage(
        "❌ সঠিক বাংলাদেশি মোবাইল নম্বর দিন।\n\nউদাহরণ: 01712345678",
        "error"
      );

      return;

    }


    sendBtn.disabled = true;

    showMessage(
      "⏳ OTP পাঠানোর প্রস্তুতি চলছে...",
      "loading"
    );


    try{

      /* RECAPTCHA না থাকলে আবার তৈরি */

      if(!recaptchaVerifier){

        await startRecaptcha();

      }


      /* BANGLADESH COUNTRY CODE */

      const fullPhone =
        "+88" + phone;


      showMessage(
        "⏳ Firebase-এ OTP request পাঠানো হচ্ছে...\n\nনম্বর: " +
        fullPhone,
        "loading"
      );


      confirmationResult =
        await signInWithPhoneNumber(
          auth,
          fullPhone,
          recaptchaVerifier
        );


      document.getElementById(
        "otpSection"
      ).style.display = "block";


      showMessage(
        "✅ OTP পাঠানো হয়েছে!\n\n" +
        "আপনার মোবাইলের SMS দেখুন।",
        "success"
      );


    }catch(error){

      console.error(
        "PHONE AUTH ERROR:",
        error
      );

      sendBtn.disabled = false;


      let msg =
        "❌ OTP পাঠানো যায়নি।\n\n";


      msg +=
        "Error Code: " +
        (error.code || "unknown") +
        "\n\n";


      msg +=
        error.message ||
        "Unknown error";


      showMessage(
        msg,
        "error"
      );


      /* নতুন reCAPTCHA */

      try{

        if(recaptchaVerifier){

          recaptchaVerifier.clear();

        }

        recaptchaVerifier = null;

        document.getElementById(
          "recaptcha-container"
        ).innerHTML = "";

        await startRecaptcha();

      }catch(e){

        console.error(e);

      }

    }

  }
);


/* VERIFY OTP */

document.getElementById(
  "verifyBtn"
).addEventListener(
  "click",
  async function(){

    const otp =
      document.getElementById(
        "otp"
      ).value.trim();


    if(!/^\d{6}$/.test(otp)){

      showMessage(
        "❌ ৬ সংখ্যার OTP দিন।",
        "error"
      );

      return;

    }


    if(!confirmationResult){

      showMessage(
        "❌ আগে OTP পাঠাতে হবে।",
        "error"
      );

      return;

    }


    const verifyBtn =
      document.getElementById(
        "verifyBtn"
      );

    verifyBtn.disabled = true;


    showMessage(
      "⏳ OTP যাচাই করা হচ্ছে...",
      "loading"
    );


    try{

      const result =
        await confirmationResult.confirm(otp);


      const user =
        result.user;


      localStorage.setItem(
        "customer_uid",
        user.uid
      );


      localStorage.setItem(
        "customer_phone",
        user.phoneNumber || ""
      );


      showMessage(
        "✅ Login সফল হয়েছে!\n\nCustomer Home Page খোলা হচ্ছে...",
        "success"
      );


      setTimeout(function(){

        window.location.href =
          "index.html";

      },1200);


    }catch(error){

      console.error(error);

      verifyBtn.disabled = false;


      showMessage(
        "❌ OTP ভুল অথবা যাচাই করা যায়নি।\n\n" +
        "Error Code: " +
        (error.code || "unknown") +
        "\n\n" +
        (error.message || ""),
        "error"
      );

    }

  }
);

</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Customer Login - ইসলামী খিদমাহ</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
  background:#f3f8f4;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:28px 20px;
  border-radius:22px;
  box-shadow:0 5px 25px #00000015;
}

.logo{
  width:75px;
  height:75px;
  background:#087443;
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 15px;
  font-size:35px;
}

h1{
  text-align:center;
  color:#087443;
  font-size:23px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:13px;
  line-height:1.6;
  margin:8px 0 25px;
}

.google-btn{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  color:#333;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.google-icon{
  font-size:20px;
  font-weight:bold;
}

.google-btn:disabled{
  opacity:.6;
}

.message{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  font-size:13px;
  line-height:1.6;
  white-space:pre-wrap;
}

.success{
  display:block;
  background:#e5f7eb;
  color:#075d35;
}

.error{
  display:block;
  background:#ffe8e8;
  color:#a00000;
}

.loading{
  display:block;
  background:#fff5d9;
  color:#765500;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#087443;
  text-decoration:none;
  font-size:13px;
}
</style>
</head>

<body>

<div class="box">

  <div class="logo">☪</div>

  <h1>ইসলামী খিদমাহ</h1>

  <p class="subtitle">
    Customer Account তৈরি করতে Google দিয়ে Login করুন
  </p>

  <button
    id="googleBtn"
    class="google-btn"
    type="button"
  >
    <span class="google-icon">G</span>
    Google দিয়ে Login করুন
  </button>

  <div id="message" class="message"></div>

  <a href="index.html" class="back">
    ← Home Page
  </a>

</div>

<script type="module">

import { auth } from "./firebase-config.js";

import {
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const googleBtn =
  document.getElementById("googleBtn");

const message =
  document.getElementById("message");


function showMessage(text,type){

  message.innerText = text;

  message.className =
    "message " + type;

}


/* GOOGLE LOGIN */

googleBtn.addEventListener(
  "click",
  async function(){

    googleBtn.disabled = true;

    showMessage(
      "⏳ Google Login চালু হচ্ছে...",
      "loading"
    );

    try{

      const provider =
        new GoogleAuthProvider();

      provider.setCustomParameters({
        prompt:"select_account"
      });

      const result =
        await signInWithPopup(
          auth,
          provider
        );

      const user =
        result.user;


      /* CUSTOMER INFORMATION */

      localStorage.setItem(
        "customer_uid",
        user.uid
      );

      localStorage.setItem(
        "customer_name",
        user.displayName || ""
      );

      localStorage.setItem(
        "customer_email",
        user.email || ""
      );

      localStorage.setItem(
        "customer_photo",
        user.photoURL || ""
      );


      showMessage(
        "✅ Google Login সফল হয়েছে!\n\n" +
        "Customer Home Page খোলা হচ্ছে...",
        "success"
      );


      setTimeout(function(){

        window.location.href =
          "index.html";

      },1000);


    }catch(error){

      console.error(
        "Google Login Error:",
        error
      );

      googleBtn.disabled = false;

      showMessage(
        "❌ Google Login করা যায়নি।\n\n" +
        "Error Code: " +
        (error.code || "unknown") +
        "\n\n" +
        (error.message || ""),
        "error"
      );

    }

  }
);

</script>

</body>
</html>
